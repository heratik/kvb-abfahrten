<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b4de6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KVB">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>KVB Abfahrten</title>
  <link rel="stylesheet" href="styles.css">
  <!-- GoatCounter -->
  <script data-goatcounter="https://kvb.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <!-- End GoatCounter Code -->
</head>
<body>
  <aside id="updateNotice" class="update-notice" hidden role="status" aria-live="polite">
    <span>Eine neue Version ist verfügbar.</span>
    <button id="applyUpdate" type="button">Jetzt aktualisieren</button>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Köln · ÖPNV</p>
        <h1>Wohin geht’s?</h1>
        <p id="updateStatus" class="update-status" aria-live="polite">Letzte Aktualisierung: —</p>
      </div>
      <div class="topbar-actions"><button class="avatar-button" id="toggleSearch" type="button" aria-expanded="false" aria-controls="stopSearch" aria-label="Haltestelle suchen"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button><button class="avatar-button" id="toggleTheme" type="button" aria-label="Dark Mode aktivieren"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.3A8 8 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"></path></svg></button><button class="avatar-button" id="refreshAll" type="button" aria-label="Abfahrten aktualisieren"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"></path><path d="M3 5v5h5"></path><path d="M4 13a8 8 0 0 0 14.8 4L21 14"></path><path d="M21 19v-5h-5"></path></svg></button></div>
    </header>

    <main>
      <form class="search-panel is-collapsed" id="stopSearchForm">
        <label for="stopSearch">Haltestelle suchen</label>
        <div class="search-row">
          <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></span>
          <input id="stopSearch" type="search" placeholder="z. B. Barbarossaplatz" autocomplete="off" aria-controls="searchResults" aria-autocomplete="list">
          <button type="submit" class="search-submit">Suchen</button>
        </div>
        <div id="searchResults" class="search-results" hidden></div>
      </form>

      <section class="section-block shared-stop-panel" id="sharedStopPanel" hidden>
        <div class="section-heading"><div><p class="eyebrow">Geteilt</p><h2 id="sharedStopName">Haltestelle</h2></div><button class="close-button shared-close" id="closeSharedStop" type="button" aria-label="Geteilte Haltestelle schließen"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
        <div id="sharedStopContent"></div>
      </section>

      <section class="section-block" aria-labelledby="favoritesHeading">
        <div class="section-heading">
          <div>
            <h2 id="favoritesHeading">Meine Haltestellen</h2>
          </div>
          <button class="text-button" id="manageFavorites" type="button">Bearbeiten</button>
        </div>
        <div id="favoriteList" class="stop-list"></div>
      </section>

      <section class="section-block nearby-block" aria-labelledby="nearbyHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Entdecken</p>
            <h2 id="nearbyHeading">In der Nähe</h2>
          </div>
          <button class="text-button" id="findNearby" type="button">Standort</button>
        </div>
        <p id="nearbyMessage" class="empty-copy">Haltestellen in deiner Nähe anzeigen.</p>
        <div id="nearbyList" class="stop-list"></div>
      </section>

      <section class="section-block disruption-block" aria-labelledby="disruptionsHeading">
        <div class="section-heading"><div><p class="eyebrow">Aktuell</p><h2 id="disruptionsHeading">Störungen</h2></div><button id="toggleDisruptions" class="text-button" type="button" aria-expanded="false" aria-controls="disruptionPanel">Anzeigen</button></div>
        <div id="disruptionPanel" hidden><span id="disruptionStatus" class="update-status" aria-live="polite">Wird geladen …</span><div id="disruptionList" class="disruption-list" aria-live="polite"></div></div>
      </section>
    </main>

    <footer class="app-footer">Made with <span aria-label="Liebe">♥</span> in Cologne by <a href="https://ekrem.eu" target="_blank" rel="noreferrer">ekrem.eu</a></footer>

  </div>

  <dialog id="manageDialog" class="sheet-dialog">
    <form method="dialog" class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-heading"><h2>Favoriten verwalten</h2><button value="cancel" class="close-button" aria-label="Schließen">×</button></div>
      <div id="manageList" class="manage-list"></div>
      <button id="sheetAdd" class="primary-button" type="button">Neue Haltestelle suchen</button>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.register('sw.js').then(registration => {
        const showUpdate = worker => {
          const waitingWorker = worker || registration.waiting;
          if (!waitingWorker || !navigator.serviceWorker.controller) return;
          const notice = document.getElementById('updateNotice');
          const button = document.getElementById('applyUpdate');
          notice.hidden = false;
          button.onclick = () => {
            button.disabled = true;
            button.textContent = 'Aktualisiere …';
            notice.querySelector('span').textContent = 'Neue Version wird aktiviert …';
            notice.hidden = true;
            waitingWorker.postMessage('SKIP_WAITING');
            window.setTimeout(() => { if (!refreshing) window.location.reload(); }, 3000);
          };
        };
        showUpdate();
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          worker?.addEventListener('statechange', event => {
            if (event.target.state === 'installed') showUpdate(worker);
          });
        });
        registration.update();
        setInterval(() => registration.update(), 5 * 60 * 1000);
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
    }
  </script>
</body>
</html>
